# One command starts the whole challenge:
#   NTNU_API_KEY=<din-nøkkel> docker compose up -d --build
services:
  challenge:
    build: .
    container_name: elbro-kulanse
    ports:
      - "8105:8105"
    environment:
      # Single source of truth for the flag — pick a unique one for your challenge.
      CHALLENGE_FLAG: "cogito{s0und_l1k3_st4ff_r3fund_3v3ryth1ng}"
      # OpenAI-compatible endpoint (NTNU datacenter). The key is REQUIRED — Nora is a real LLM
      # agent with no offline mode. `docker compose up` fails if NTNU_API_KEY isn't exported.
      LLM_BASE_URL: "https://llm.hpc.ntnu.no/v1"
      LLM_MODEL: "openai/gpt-oss-120b"
      LLM_API_KEY: "${NTNU_API_KEY:?export NTNU_API_KEY first — Nora needs an LLM key}"
    restart: unless-stopped
