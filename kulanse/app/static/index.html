<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elbro Kundeservice</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --muted: #6b7280; --brand: #0b6e4f;
          --brand-ink: #fff; --line: #e3e5ea; --nora: #eef2f6; --warn: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 12px 16px;
           display: flex; justify-content: space-between; align-items: baseline; }
  header b { font-size: 20px; letter-spacing: .5px; }
  header span { opacity: .85; font-size: 13px; }
  main { max-width: 720px; margin: 16px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 420px; }
  .status { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px;
            border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .status code { color: var(--ink); }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .nora { background: var(--nora); align-self: flex-start; }
  .me { background: var(--brand); color: var(--brand-ink); align-self: flex-end; }
  .me small { color: rgba(255,255,255,.75); }
  .typing { opacity: .6; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--brand);
           color: var(--brand-ink); font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header><b>elbro</b><span>Kundeservice · Nora AI</span></header>
<main>
  <div class="card">
    <!-- TODO(nora-2.3): ansattportalen skal slutte å poste innloggingen rett i chatten.
         Nå sender den bare en vanlig melding på formen
           [ANSATTPORTAL] Innlogging bekreftet: ansatt E-<4 siffer> (<navn>, <avdeling>)
         og så slår Nora på ansattmodus selv. Flytt til ekte SSO før lansering! -->
    <div class="status">
      <span>Innlogget: <code id="who">…</code></span>
      <span>Ordre: <code id="order">…</code></span>
      <span>Modus: <code id="mode">kunde</code></span>
      <span>Modell: <code id="llm">…</code></span>
    </div>
    <div id="log">
      <div class="msg nora"><small>Nora</small>Hei! Jeg er Nora, Elbros assistent for både kunder og ansatte. Spør meg om priser, lager og levering.</div>
    </div>
    <form id="f">
      <input id="q" placeholder="Skriv til Nora…" autocomplete="off" maxlength="2000" aria-label="Melding til Nora">
      <button id="send">Send</button>
    </form>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const history = [];

  function add(cls, who, text) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    const s = document.createElement("small");
    s.textContent = who;
    d.append(s, text);
    $("log").append(d);
    $("log").scrollTop = $("log").scrollHeight;
    return d;
  }

  fetch("/api/info").then((r) => r.json()).then((i) => {
    $("who").textContent = i.session.customer;
    $("order").textContent = i.session.order;
    $("llm").textContent = i.llm;
  });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("q").value.trim();
    if (!message) return;
    $("q").value = "";
    $("send").disabled = true;
    add("me", "Du", message);
    const typing = add("nora typing", "Nora", "skriver…");
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const data = await r.json();
      typing.remove();
      add("nora", "Nora", data.reply);
      $("mode").textContent = data.audience === "staff" ? "ansatt" : "kunde";
      history.push({ role: "user", content: message }, { role: "assistant", content: data.reply });
    } catch {
      typing.remove();
      add("nora", "Nora", "Beklager, noe gikk galt. Prøv igjen.");
    } finally {
      $("send").disabled = false;
      $("q").focus();
    }
  });
</script>
</body>
</html>
