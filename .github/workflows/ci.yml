name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenges:
    name: ${{ matrix.challenge }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        challenge: [brain-hq, pokemon-supply-chain]
    defaults:
      run:
        working-directory: ${{ matrix.challenge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.challenge }}/requirements.txt
      - name: Install challenge dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Run Pokémon tests (mocked LLM, no API key needed)
        if: matrix.challenge == 'pokemon-supply-chain'
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build standalone challenge images
        run: docker compose build
