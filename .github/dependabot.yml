version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /brain-hq
      - /pokemon-supply-chain
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories:
      - /brain-hq
      - /pokemon-supply-chain
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
